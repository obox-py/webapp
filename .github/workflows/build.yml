name: build

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: obox-py/obox
          path: obox
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project obox
      - run: uv run --project obox python -c "import json; json.load(open('extension.json', encoding='utf-8'))"
      - run: uv run --project obox python obox/scripts/pack_extension.py . --dist dist

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: obox-py/obox
          path: obox
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project obox
      - run: uv run --project obox python obox/scripts/pack_extension.py . --dist dist
      - name: Name per arch
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Get-ChildItem dist -Filter *.oix | Select-Object -First 1 | ForEach-Object {
            Copy-Item $_.FullName ("dist-release/webapp-" + $env:REF_NAME + "-" + $env:ARCH + ".oix")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: webapp-${{ matrix.arch }}
          path: dist-release/*.oix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.oix